# TestPaper Pro — Netlify config
# Static site lives at the repo root (index.html); the AI proxy is a serverless function.
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The Gemini key is NOT here — set it in the Netlify UI:
#   Site configuration → Environment variables → GEMINI_API_KEY = <your free key>
# Optional: ALLOWED_ORIGINS = https://your-site.netlify.app  (blocks other sites from using the proxy)

# Alternate public route to the AI proxy. Some Netlify edge regions misroute
# POSTs to /.netlify/functions/* ; /api/gemini goes through the redirect engine
# and is proxied server-side to the same function (method + body preserved).
[[redirects]]
  from = "/api/gemini"
  to = "/.netlify/functions/gemini"
  status = 200
  force = true
